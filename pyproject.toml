[project]
name = "generative-recsys"
version = "0.1.0"
description = "A systems-oriented lab for classical, sequential, and generative recommendation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faiss-cpu>=1.15.1",
    "numpy>=2.0",
    "omegaconf>=2.4.0",
    "pandas>=2.2",
    "pyarrow>=26.0.0",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/generative_recsys"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
